<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beerleague</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFBF00">
    <style>
        :root { --dark-bg: #121212; --surface: #1E1E1E; --amber: #FFBF00; --text-light: #F5F5F5; --miss-red: #CF6679; }
        body { background-color: var(--dark-bg); color: var(--text-light); font-family: sans-serif; margin: 0; padding: 20px; text-align: center; padding-bottom: 80px; }
        h1, h2, h3 { color: var(--amber); }
        button { background-color: var(--amber); color: var(--dark-bg); border: none; border-radius: 12px; padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px 5px; width: 90%; max-width: 400px; }
        button.btn-secondary { background-color: var(--surface); color: var(--amber); border: 2px solid var(--amber); }
        button.btn-miss { background-color: var(--surface); color: var(--miss-red); border: none;}
        input[type="text"] { background-color: var(--surface); color: white; border: 1px solid gray; padding: 15px; border-radius: 8px; font-size: 16px; width: 80%; max-width: 350px; margin-bottom: 10px; }
        
        .giant-btn { height: 150px; font-size: 32px; width: 45%; margin: 5px; }
        .list-card { background-color: var(--surface); padding: 15px; margin: 10px auto; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; max-width: 400px; text-align: left; }
        .screen { display: none; }
        .active-screen { display: block; }
        .flex-row { display: flex; justify-content: center; flex-wrap: wrap; }
        
        /* Checkboxes pour la sélection */
        .checkbox-container { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 10px; }
        .checkbox-container input { width: 25px; height: 25px; margin-right: 15px; accent-color: var(--amber); }
        .setup-section { background-color: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto;}
    </style>
</head>
<body>

    <div id="dashboard" class="screen active-screen">
        <h1>🍺 BEERLEAGUE</h1>
        
        <div class="flex-row">
            <button onclick="goToSetup()">Nouveau Match</button>
            <button class="btn-secondary" onclick="showScreen('manage-players')">Gérer Joueurs</button>
            <button class="btn-secondary" onclick="showScreen('manage-referees')">Gérer Arbitres</button>
        </div>

        <h2>Classement Ligue</h2>
        <div id="leaderboard-list"></div>
    </div>

    <div id="manage-players" class="screen">
        <h2>Effectif</h2>
        <input type="text" id="new-player-name" placeholder="Nom du joueur...">
        <button onclick="addPlayer()">Ajouter Joueur</button>
        <div id="players-list-ui" style="margin-top: 20px;"></div>
        <button class="btn-secondary" onclick="showScreen('dashboard')">Retour Menu</button>
    </div>

    <div id="manage-referees" class="screen">
        <h2>Corps Arbitral</h2>
        <input type="text" id="new-referee-name" placeholder="Nom de l'arbitre...">
        <button onclick="addReferee()">Ajouter Arbitre</button>
        <div id="referees-list-ui" style="margin-top: 20px;"></div>
        <button class="btn-secondary" onclick="showScreen('dashboard')">Retour Menu</button>
    </div>

    <div id="setup-match" class="screen">
        <h2>Configuration du Match</h2>
        
        <div class="setup-section">
            <h3 style="color: white;">1. Équipe A</h3>
            <div id="setup-team-a"></div>
        </div>

        <div class="setup-section">
            <h3 style="color: white;">2. Équipe B</h3>
            <div id="setup-team-b"></div>
        </div>

        <div class="setup-section">
            <h3 style="color: white;">3. L'Arbitre</h3>
            <select id="setup-referee" style="width: 100%; padding: 10px; background: var(--surface); color: white; font-size: 16px;">
                </select>
        </div>

        <button onclick="startMatch()">LANCER LE MATCH</button>
        <button class="btn-secondary" onclick="showScreen('dashboard')">Annuler</button>
    </div>

    <div id="live-match" class="screen">
        <p style="color: gray;">Arbitré par : <span id="live-referee"></span></p>
        <h3 style="color: white;">AU TOUR DE L'ÉQUIPE</h3>
        <h1 id="active-team-name" style="font-size: 40px; margin: 0;">A</h1>
        <p style="font-size: 24px; margin-top: 30px;">Tireur : <strong id="active-player-name">...</strong></p>
        
        <div style="margin-top: 50px;" class="flex-row">
            <button class="btn-miss giant-btn" onclick="registerShot(false)">RATÉ</button>
            <button class="giant-btn" onclick="registerShot(true)">TOUCHÉ</button>
        </div>
        <button style="margin-top: 50px; background-color: var(--surface); color: white;" onclick="goToEndScreen()">Fin du Match</button>
    </div>

    <div id="end-match" class="screen">
        <h1>FIN DU MATCH</h1>
        <h3>Qui a gagné ?</h3>
        <button onclick="finishAndCalculateElo('A')">Victoire Équipe A</button>
        <button onclick="finishAndCalculateElo('B')">Victoire Équipe B</button>
    </div>

    <script>
        // --- BASE DE DONNÉES LOCALE ---
        let players = JSON.parse(localStorage.getItem('bl_players')) || [];
        let referees = JSON.parse(localStorage.getItem('bl_referees')) || [];

        // Variables de match
        let teamA = []; let teamB = []; let currentRef = "";
        let currentTeam = 'A'; let indexA = 0; let indexB = 0;

        // --- NAVIGATION ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
            if(screenId === 'dashboard') renderDashboard();
            if(screenId === 'manage-players') renderPlayersManager();
            if(screenId === 'manage-referees') renderRefereesManager();
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = '';
            if (players.length === 0) listDiv.innerHTML = "<p style='color:gray'>Aucun joueur. Allez en ajouter !</p>";
            
            [...players].sort((a, b) => b.elo - a.elo).forEach((p, index) => {
                let accuracy = p.totalShots > 0 ? ((p.hits / p.totalShots) * 100).toFixed(1) : 0;
                listDiv.innerHTML += `
                    <div class="list-card">
                        <div><strong>#${index + 1} ${p.name}</strong><br><small style="color:gray">${accuracy}% Précision | ${p.matchesPlayed} Matchs</small></div>
                        <div style="color: var(--amber); font-weight: bold; font-size: 20px;">${p.elo}</div>
                    </div>`;
            });
            saveData();
        }

        // --- GESTION JOUEURS & ARBITRES ---
        function addPlayer() {
            let nameInput = document.getElementById('new-player-name');
            if(nameInput.value.trim() !== "") {
                players.push({ id: Date.now(), name: nameInput.value.trim(), elo: 1000, hits: 0, totalShots: 0, matchesPlayed: 0 });
                nameInput.value = "";
                renderPlayersManager();
                saveData();
            }
        }

        function renderPlayersManager() {
            const listDiv = document.getElementById('players-list-ui');
            listDiv.innerHTML = players.map(p => `<div class="list-card">${p.name} <span>${p.elo} ELO</span></div>`).join('');
        }

        function addReferee() {
            let nameInput = document.getElementById('new-referee-name');
            if(nameInput.value.trim() !== "") {
                referees.push({ id: Date.now(), name: nameInput.value.trim() });
                nameInput.value = "";
                renderRefereesManager();
                saveData();
            }
        }

        function renderRefereesManager() {
            const listDiv = document.getElementById('referees-list-ui');
            listDiv.innerHTML = referees.map(r => `<div class="list-card">${r.name}</div>`).join('');
        }

        function saveData() {
            localStorage.setItem('bl_players', JSON.stringify(players));
            localStorage.setItem('bl_referees', JSON.stringify(referees));
        }

        // --- SETUP MATCH ---
        function goToSetup() {
            if(players.length < 2) { alert("Il faut au moins 2 joueurs !"); return; }
            if(referees.length < 1) { alert("Il faut au moins 1 arbitre !"); return; }
            
            let htmlA = ''; let htmlB = '';
            players.forEach(p => {
                htmlA += `<label class="checkbox-container"><input type="checkbox" value="${p.id}" class="check-team-a"> ${p.name}</label>`;
                htmlB += `<label class="checkbox-container"><input type="checkbox" value="${p.id}" class="check-team-b"> ${p.name}</label>`;
            });
            document.getElementById('setup-team-a').innerHTML = htmlA;
            document.getElementById('setup-team-b').innerHTML = htmlB;

            let refSelect = document.getElementById('setup-referee');
            refSelect.innerHTML = referees.map(r => `<option value="${r.name}">${r.name}</option>`).join('');

            showScreen('setup-match');
        }

        function startMatch() {
            teamA = []; teamB = [];
            
            document.querySelectorAll('.check-team-a:checked').forEach(cb => {
                teamA.push(players.find(p => p.id == cb.value));
            });
            document.querySelectorAll('.check-team-b:checked').forEach(cb => {
                teamB.push(players.find(p => p.id == cb.value));
            });

            if(teamA.length === 0 || teamB.length === 0) {
                alert("Chaque équipe doit avoir au moins 1 joueur !"); return;
            }

            currentRef = document.getElementById('setup-referee').value;
            currentTeam = 'A'; indexA = 0; indexB = 0;
            
            document.getElementById('live-referee').innerText = currentRef;
            updateLiveUI();
            showScreen('live-match');
        }

        // --- LIVE MATCH ---
        function updateLiveUI() {
            document.getElementById('active-team-name').innerText = currentTeam;
            document.getElementById('active-player-name').innerText = currentTeam === 'A' ? teamA[indexA].name : teamB[indexB].name;
        }

        function registerShot(isHit) {
            let activePlayer = currentTeam === 'A' ? teamA[indexA] : teamB[indexB];
            
            // On met à jour le joueur direct dans la base globale
            let playerInDb = players.find(p => p.id === activePlayer.id);
            playerInDb.totalShots += 1;
            if (isHit) playerInDb.hits += 1;

            if (currentTeam === 'A') { indexA = (indexA + 1) % teamA.length; currentTeam = 'B'; } 
            else { indexB = (indexB + 1) % teamB.length; currentTeam = 'A'; }
            updateLiveUI();
            saveData();
        }

        function goToEndScreen() { showScreen('end-match'); }

        // --- ELO ---
        function finishAndCalculateElo(winner) {
            let kFactor = 32;
            let avgEloA = teamA.reduce((sum, p) => sum + p.elo, 0) / teamA.length;
            let avgEloB = teamB.reduce((sum, p) => sum + p.elo, 0) / teamB.length;

            let expectedA = 1 / (1 + Math.pow(10, (avgEloB - avgEloA) / 400));
            let expectedB = 1 - expectedA;

            let actualA = winner === 'A' ? 1 : 0;
            let actualB = winner === 'B' ? 1 : 0;

            let deltaA = Math.round(kFactor * (actualA - expectedA));
            let deltaB = Math.round(kFactor * (actualB - expectedB));

            // Application de l'Elo et incrément des matchs joués
            teamA.forEach(p => {
                let dbPlayer = players.find(player => player.id === p.id);
                dbPlayer.elo += deltaA;
                dbPlayer.matchesPlayed += 1;
            });
            teamB.forEach(p => {
                let dbPlayer = players.find(player => player.id === p.id);
                dbPlayer.elo += deltaB;
                dbPlayer.matchesPlayed += 1;
            });

            saveData();
            showScreen('dashboard');
        }

        // Init
        renderDashboard();
    <script>
        // --- BASE DE DONNÉES SÉCURISÉE ---
        let players = [];
        let referees = [];
        try {
            players = JSON.parse(localStorage.getItem('bl_players')) || [];
            if (!Array.isArray(players)) players = []; // Sécurité anti-crash
            referees = JSON.parse(localStorage.getItem('bl_referees')) || [];
            if (!Array.isArray(referees)) referees = [];
        } catch(e) {
            players = []; referees = [];
        }

        // Variables de match
        let teamA = []; let teamB = []; let currentRef = "";
        let currentTeam = 'A'; let indexA = 0; let indexB = 0;

        // --- NAVIGATION ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
            if(screenId === 'dashboard') renderDashboard();
            if(screenId === 'manage-players') renderPlayersManager();
            if(screenId === 'manage-referees') renderRefereesManager();
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = '';
            if (players.length === 0) {
                listDiv.innerHTML = "<p style='color:gray'>Aucun joueur. Allez en ajouter !</p>";
            } else {
                // Tri sécurisé
                let sortedPlayers = players.slice().sort((a, b) => b.elo - a.elo);
                sortedPlayers.forEach((p, index) => {
                    let accuracy = p.totalShots > 0 ? ((p.hits / p.totalShots) * 100).toFixed(1) : 0;
                    listDiv.innerHTML += `
                        <div class="list-card">
                            <div><strong>#${index + 1} ${p.name}</strong><br><small style="color:gray">${accuracy}% Précision | ${p.matchesPlayed || 0} Matchs</small></div>
                            <div style="color: var(--amber); font-weight: bold; font-size: 20px;">${p.elo}</div>
                        </div>`;
                });
            }
            saveData();
        }

        // --- GESTION JOUEURS & ARBITRES ---
        function addPlayer() {
            let nameInput = document.getElementById('new-player-name');
            if(nameInput.value.trim() !== "") {
                players.push({ id: Date.now(), name: nameInput.value.trim(), elo: 1000, hits: 0, totalShots: 0, matchesPlayed: 0 });
                nameInput.value = "";
                renderPlayersManager();
                saveData();
            }
        }

        function renderPlayersManager() {
            const listDiv = document.getElementById('players-list-ui');
            listDiv.innerHTML = players.map(p => `<div class="list-card">${p.name} <span>${p.elo} ELO</span></div>`).join('');
        }

        function addReferee() {
            let nameInput = document.getElementById('new-referee-name');
            if(nameInput.value.trim() !== "") {
                referees.push({ id: Date.now(), name: nameInput.value.trim() });
                nameInput.value = "";
                renderRefereesManager();
                saveData();
            }
        }

        function renderRefereesManager() {
            const listDiv = document.getElementById('referees-list-ui');
            listDiv.innerHTML = referees.map(r => `<div class="list-card">${r.name}</div>`).join('');
        }

        function saveData() {
            localStorage.setItem('bl_players', JSON.stringify(players));
            localStorage.setItem('bl_referees', JSON.stringify(referees));
        }

        // --- SETUP MATCH ---
        function goToSetup() {
            if(players.length < 2) { alert("Il faut au moins 2 joueurs !"); return; }
            if(referees.length < 1) { alert("Il faut au moins 1 arbitre !"); return; }
            
            let htmlA = ''; let htmlB = '';
            players.forEach(p => {
                htmlA += `<label class="checkbox-container"><input type="checkbox" value="${p.id}" class="check-team-a"> ${p.name}</label>`;
                htmlB += `<label class="checkbox-container"><input type="checkbox" value="${p.id}" class="check-team-b"> ${p.name}</label>`;
            });
            document.getElementById('setup-team-a').innerHTML = htmlA;
            document.getElementById('setup-team-b').innerHTML = htmlB;

            let refSelect = document.getElementById('setup-referee');
            refSelect.innerHTML = referees.map(r => `<option value="${r.name}">${r.name}</option>`).join('');

            showScreen('setup-match');
        }

        function startMatch() {
            teamA = []; teamB = [];
            
            document.querySelectorAll('.check-team-a:checked').forEach(cb => {
                teamA.push(players.find(p => p.id == cb.value));
            });
            document.querySelectorAll('.check-team-b:checked').forEach(cb => {
                teamB.push(players.find(p => p.id == cb.value));
            });

            if(teamA.length === 0 || teamB.length === 0) {
                alert("Chaque équipe doit avoir au moins 1 joueur !"); return;
            }

            currentRef = document.getElementById('setup-referee').value;
            currentTeam = 'A'; indexA = 0; indexB = 0;
            
            document.getElementById('live-referee').innerText = currentRef;
            updateLiveUI();
            showScreen('live-match');
        }

        // --- LIVE MATCH ---
        function updateLiveUI() {
            document.getElementById('active-team-name').innerText = currentTeam;
            document.getElementById('active-player-name').innerText = currentTeam === 'A' ? teamA[indexA].name : teamB[indexB].name;
        }

        function registerShot(isHit) {
            let activePlayer = currentTeam === 'A' ? teamA[indexA] : teamB[indexB];
            let playerInDb = players.find(p => p.id === activePlayer.id);
            if(playerInDb) {
                playerInDb.totalShots += 1;
                if (isHit) playerInDb.hits += 1;
            }

            if (currentTeam === 'A') { indexA = (indexA + 1) % teamA.length; currentTeam = 'B'; } 
            else { indexB = (indexB + 1) % teamB.length; currentTeam = 'A'; }
            updateLiveUI();
            saveData();
        }

        function goToEndScreen() { showScreen('end-match'); }

        // --- ELO ---
        function finishAndCalculateElo(winner) {
            let kFactor = 32;
            let avgEloA = teamA.reduce((sum, p) => sum + p.elo, 0) / teamA.length;
            let avgEloB = teamB.reduce((sum, p) => sum + p.elo, 0) / teamB.length;

            let expectedA = 1 / (1 + Math.pow(10, (avgEloB - avgEloA) / 400));
            let expectedB = 1 - expectedA;

            let actualA = winner === 'A' ? 1 : 0;
            let actualB = winner === 'B' ? 1 : 0;

            let deltaA = Math.round(kFactor * (actualA - expectedA));
            let deltaB = Math.round(kFactor * (actualB - expectedB));

            teamA.forEach(p => {
                let dbPlayer = players.find(player => player.id === p.id);
                if(dbPlayer) { dbPlayer.elo += deltaA; dbPlayer.matchesPlayed = (dbPlayer.matchesPlayed || 0) + 1; }
            });
            teamB.forEach(p => {
                let dbPlayer = players.find(player => player.id === p.id);
                if(dbPlayer) { dbPlayer.elo += deltaB; dbPlayer.matchesPlayed = (dbPlayer.matchesPlayed || 0) + 1; }
            });

            saveData();
            showScreen('dashboard');
        }

        // Init
        renderDashboard();
    </script>
</body>
</html>
